<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Tripper cluster shape) -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="#27272a" stroke-width="12"/>
  
  <!-- Outer Gauge Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ring)" stroke-width="14" stroke-dasharray="800 200" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  
  <!-- Compass / Navigation Arrow -->
  <g transform="translate(256 256) rotate(35)">
    <polygon points="0,-150 45,60 0,25" fill="url(#needle)" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.6))"/>
    <polygon points="0,-150 -45,60 0,25" fill="#f87171" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.6))"/>
    <polygon points="0,25 45,60 0,110" fill="#71717a"/>
    <polygon points="0,25 -45,60 0,110" fill="#a1a1aa"/>
    <circle cx="0" cy="25" r="16" fill="#ffffff" stroke="#18181b" stroke-width="4"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="380" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HIMALAYAN</text>
  <text x="256" y="415" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#06b6d4" text-anchor="middle" letter-spacing="6">450 NAV</text>
</svg>
